version: 2
models:
  - name: stg_shopify_orders
    description: One row per order. Orders that cannot be identified or dated are excluded;
      conflicting order_id versions keep the most recent by created_at. A negative total_price is
      kept and flagged, not dropped -- see total_price_is_invalid.
    columns:
      - name: order_id
        description: Shopify order identifier. Grain of this model.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: Shopify customer identifier. Null for guest/anonymous checkouts or when missing
          from the source.
      - name: created_at
        description: Order creation timestamp, assumed to already be UTC.
        data_tests:
          - not_null
      - name: order_date
        description: Order timestamp converted to REPORTING_TIMEZONE (default Europe/Berlin); Meta
          must use the same reporting calendar.
        data_tests:
          - not_null
      - name: total_price
        description: Gross order value in EUR (assumed store currency), as sent by the source. See
          total_price_is_invalid to identify rows excluded from revenue. Refunds require a separate
          source
        data_tests:
          - non_negative:
              config:
                severity: warn
      - name: total_price_is_invalid
        description: True when total_price is negative or unknown. Excluded from int_shopify_daily
          revenue; the order itself is still counted.
        data_tests:
          - not_null
      - name: discount_code
        description: Discount code applied to the order. Null when absent or blank.
