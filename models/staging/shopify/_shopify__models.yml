version: 2
models:
  - name: stg_shopify_orders
    description: One row per order after type normalization and exact deduplication. Conflicting
      order versions, missing required values and negative amounts fail dbt build.
    columns:
      - name: order_id
        description: Shopify order identifier. Grain of this model.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: Shopify customer identifier. Null for guest/anonymous checkouts or when missing
          from the source.
      - name: created_at
        description: Order creation timestamp, assumed to already be UTC.
        data_tests:
          - not_null
      - name: order_date
        description: Order timestamp converted to REPORTING_TIMEZONE (default Europe/Berlin); Meta
          must use the same reporting calendar.
        data_tests:
          - not_null
      - name: total_price
        description: Gross order value in EUR (assumed store currency). Must be known and non-negative.
          Refunds require a separate source; see docs/data_contract.md.
        data_tests:
          - not_null
          - non_negative
      - name: discount_code
        description: Discount code applied to the order. Null when absent or blank.
