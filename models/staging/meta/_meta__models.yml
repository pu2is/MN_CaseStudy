version: 2

models:
  - name: stg_meta_insights
    description: >
      One row per date and campaign_id. Normalizes types, drops rows that
      cannot be dated or attributed to a campaign, deduplicates on
      (date, campaign_id), and flags (without changing or dropping) rows with
      negative spend/impressions/clicks. Contains no CAC/ROAS or other
      cross-source business logic -- see marts/marketing for that.
    data_tests:
      - unique:
          column_name: "concat(cast(date as string), '-', campaign_id)"
    columns:
      - name: date
        description: >
          Reporting date, as sent by the source. Part of this model's grain.
          Assumed to already be a calendar date in the shared reporting
          timezone (the `reporting_timezone` dbt var -- see
          dbt_project.yml and orchestration/settings.py's
          REPORTING_TIMEZONE), i.e. that the Meta ad account's own timezone
          setting matches it. If the real ad account is ever configured with
          a different timezone, its dates must be normalized to
          reporting_timezone before joining with Shopify's order_date (see
          stg_shopify_orders.order_date) at a daily grain.
        data_tests:
          - not_null
      - name: campaign_id
        description: Meta campaign identifier. Part of this model's grain.
        data_tests:
          - not_null
      - name: spend
        description: >
          Ad spend in EUR, as sent by the source (including negative values,
          if any). Zero is a valid value (e.g. a paused campaign). Negative
          spend has no legitimate business meaning, but it's a recoverable
          source anomaly: has_invalid_negative_value already flags the row for
          exclusion from aggregation (see int_meta_daily), so it's warned on
          rather than erroring -- a single bad historical row must not block
          the daily pipeline from reaching check_yesterday_roas.
        data_tests:
          - non_negative:
              config:
                severity: warn
      - name: impressions
        description: >
          Ad impressions, as sent by the source. Zero is a valid value.
          Negative values are warned on, not errored on, for the same reason
          as spend -- see that column's description.
        data_tests:
          - non_negative:
              config:
                severity: warn
      - name: clicks
        description: >
          Ad clicks, as sent by the source. Zero is a valid value. Negative
          values are warned on, not errored on, for the same reason as spend
          -- see that column's description.
        data_tests:
          - non_negative:
              config:
                severity: warn
      - name: has_invalid_negative_value
        description: >
          True when spend, impressions, or clicks is a negative number.
        data_tests:
          - not_null
