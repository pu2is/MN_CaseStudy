version: 2
models:
  - name: stg_meta_insights
    description: One row per campaign and date after type normalization and exact deduplication.
      Conflicting snapshots and invalid required values fail dbt build.
    data_tests:
      - unique:
          arguments:
            column_name: concat(cast(date as string), '-', campaign_id)
    columns:
      - name: date
        description: Date in the Meta ad account timezone, which must match REPORTING_TIMEZONE. Daily
          aggregates alone cannot be converted to another timezone.
        data_tests:
          - not_null
      - name: campaign_id
        description: Meta campaign identifier. Part of this model's grain.
        data_tests:
          - not_null
      - name: spend
        description: Campaign spend in EUR. Must be known and non-negative; zero is valid.
        data_tests:
          - not_null
          - non_negative
      - name: impressions
        description: Daily campaign impression count. Must be known and non-negative; zero is valid.
        data_tests:
          - not_null
          - non_negative
      - name: clicks
        description: Daily campaign click count. Must be known and non-negative; zero is valid.
        data_tests:
          - not_null
          - non_negative
