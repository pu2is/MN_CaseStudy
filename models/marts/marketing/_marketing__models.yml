version: 2
models:
  - name: fct_marketing_performance
    description: One row per calendar date between the earliest and latest observed source dates.
      Daily Shopify revenue / Meta spend and Meta spend / all new Shopify customers are blended proxies,
      not attributed campaign metrics. Missing source data stays null, including dates missing from
      both sources. See docs/data_contract.md.
    columns:
      - name: date
        description: Calendar date. Grain of this model.
        data_tests:
          - unique
          - not_null
      - name: revenue
        description: Daily Shopify revenue. Null when no Shopify data exists for this date.
        data_tests:
          - non_negative
      - name: orders
        description: Daily Shopify order count. Null when no Shopify data exists for this date.
        data_tests:
          - non_negative
      - name: new_customers
        description: Daily count of customers placing their first known order. Null when no Shopify
          data exists for this date. Cannot exceed orders on the same date, since every new customer's
          first order is itself one of that date's orders.
        data_tests:
          - non_negative
          - not_greater_than:
              arguments:
                other_column_name: orders
      - name: ad_spend
        description: Daily Meta ad spend, in EUR. Null when no Meta data exists for this date.
        data_tests:
          - non_negative
      - name: impressions
        description: Daily Meta impressions. Null when no Meta data exists for this date.
        data_tests:
          - non_negative
      - name: clicks
        description: Daily Meta clicks. Null when no Meta data exists for this date.
        data_tests:
          - non_negative
      - name: roas
        description: Blended revenue / ad_spend. Null when revenue or spend is unknown, or spend
          is zero.
        data_tests:
          - non_negative
      - name: cac
        description: Blended ad_spend / new_customers in EUR. Null when either input is unknown or
          new_customers is zero. Zero when spend is zero and new_customers is positive.
        data_tests:
          - non_negative
