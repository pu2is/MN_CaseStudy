version: 2
models:
  - name: int_meta_daily
    description: One row per date, aggregating Meta ad insights across all campaigns. Rows flagged
      with an invalid negative or unknown value (spend, impressions, or clicks) are excluded entirely
      from all three sums -- see stg_meta_insights.has_invalid_negative_value. The excluded row count
      is preserved in invalid_rows so downstream consumers can tell a complete day from a partial one.
    columns:
      - name: date
        description: Reporting date. Grain of this model.
        data_tests:
          - unique
          - not_null
      - name: ad_spend
        description: Sum of spend across validated campaigns for this date, in EUR.
        data_tests:
          - not_null
      - name: impressions
        description: Sum of impressions across all campaigns for this date.
        data_tests:
          - not_null
      - name: clicks
        description: Sum of clicks across all campaigns for this date.
        data_tests:
          - not_null
      - name: invalid_rows
        description: Count of campaign rows for this date excluded from ad_spend, impressions and
          clicks due to an invalid negative or unknown value. A non-zero count means the sums above
          are a partial, not complete, view of this date's Meta data.
        data_tests:
          - not_null
