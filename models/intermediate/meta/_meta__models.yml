version: 2
models:
  - name: int_meta_daily
    description: One row per date, aggregating Meta ad insights across all campaigns. Rows flagged
      with an invalid negative or unknown value (spend, impressions, or clicks) are excluded entirely
      from all three sums -- see stg_meta_insights.has_invalid_negative_value.
    columns:
      - name: date
        description: Reporting date. Grain of this model.
        data_tests:
          - unique
          - not_null
      - name: ad_spend
        description: Sum of spend across validated campaigns for this date, in EUR.
        data_tests:
          - not_null
      - name: impressions
        description: Sum of impressions across all campaigns for this date.
        data_tests:
          - not_null
      - name: clicks
        description: Sum of clicks across all campaigns for this date.
        data_tests:
          - not_null
