name: 'mellow_noir_case_study'
version: '1.0.0'
config-version: 2

profile: 'mellow_noir_case_study'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # Single reporting-timezone policy, shared with the Prefect flow's
  # REPORTING_TIMEZONE env var (see orchestration/settings.py). The flow
  # forwards its value here via `dbt --vars` on every invocation, so this
  # default is only used when a developer runs dbt directly -- keep it equal
  # to Settings.reporting_timezone's default so the two never silently
  # disagree. Used by stg_shopify_orders to convert order timestamps into a
  # calendar order_date, and documented as the assumed Meta ad account
  # calendar in stg_meta_insights.
  reporting_timezone: "Europe/Berlin"

models:
  mellow_noir_case_study:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
