[project]
name = "mellow-noir-case-study"
version = "0.1.0"
description = "Daily blended CAC/ROAS models and a Prefect Slack alert workflow"
requires-python = ">=3.11"
dependencies = [
    "dbt-bigquery>=1.12.0",
    "google-cloud-bigquery>=3.45.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pyyaml>=6.0.3",
    "prefect>=3.8.5",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "duckdb>=1.4.0",
    "sqlglot>=30.18.0",
    "ruff>=0.12.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
line-ending = "lf"
