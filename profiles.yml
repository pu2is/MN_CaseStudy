# Local/CI dbt connection profile for this repo.
#
# No secrets live in this file. Point dbt at it with either:
#   - the DBT_PROFILES_DIR env var set to the repo root, or
#   - `dbt <command> --profiles-dir .`
#
# `dev` uses your local `gcloud auth application-default login` credentials.
# `ci`/`prod` authenticate via a service-account keyfile whose *path* (never
# its contents) is supplied through the GOOGLE_APPLICATION_CREDENTIALS env var.
mellow_noir_case_study:
  target: dev
  outputs:
    dev:
      type: bigquery
      method: oauth
      project: "{{ env_var('BIGQUERY_PROJECT', 'mellow-noir-dev') }}"
      dataset: "{{ env_var('BIGQUERY_DATASET', 'mellow_noir') }}"
      location: "{{ env_var('BIGQUERY_LOCATION', 'EU') }}"
      threads: 4
    ci:
      type: bigquery
      method: service-account
      keyfile: "{{ env_var('GOOGLE_APPLICATION_CREDENTIALS') }}"
      project: "{{ env_var('BIGQUERY_PROJECT') }}"
      dataset: "{{ env_var('BIGQUERY_DATASET', 'mellow_noir') }}"
      location: "{{ env_var('BIGQUERY_LOCATION', 'EU') }}"
      threads: 4
